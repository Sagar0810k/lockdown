name: Build APK

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK (debug-signed via template keystore)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage APK with a clean filename
        shell: bash
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n1)
          cp "$APK" Lockdown-1.0.0.apk
          ls -lh Lockdown-1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lockdown-apk
          path: Lockdown-1.0.0.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (rolling v1.0.0)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release view v1.0.0 >/dev/null 2>&1 || \
            gh release create v1.0.0 \
              --title "Lockdown 1.0.0" \
              --notes "Rolling release of the latest master build (currently $SHORT_SHA). Download the APK below and install it directly on your Android phone."
          gh release upload v1.0.0 Lockdown-1.0.0.apk --clobber
          gh release edit v1.0.0 --title "Lockdown 1.0.0 ($SHORT_SHA)" --notes "Rolling release of the latest master build (currently $SHORT_SHA). Download the APK below and install it directly on your Android phone."
